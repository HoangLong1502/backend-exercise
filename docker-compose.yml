version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: postgres_projectB
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-projectb_db}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - pgdata_projectB:/var/lib/postgresql/data

volumes:
  pgdata_projectB:
